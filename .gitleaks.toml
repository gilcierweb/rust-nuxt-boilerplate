[allowlist]
  description = "Global allowlist"
  # The tracked surfaces a real secret is most likely to be pasted into by
  # accident (.env.example, README.md) are NOT here: the scan gate exists to
  # catch exactly that paste. Only the deliberate fixture files are.
  paths = [
    '''test_utils\.rs$''',
    '''test_repositories\.rs$''',
    '''test_security\.rs$''',
    '''test_key_manager\.rs$''',
    '''test_config\.rs$''',
  ]

[[rules]]
  id = "generic-api-key"
  description = "Ignore test fixtures with fake keys"
  regex = '''(?i)(master_key|blind_index_key|csrf_secret_key|backend_api_key|refresh_token_hash_salt)'''
  path = '''test_'''
  tags = ["test", "fixture"]
