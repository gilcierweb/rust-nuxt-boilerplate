# Render Blueprint — declarative deploy config for the Rust backend.
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy via: Render Dashboard -> New -> Blueprint -> point at this repo.
# Render reads this file and provisions the service with the commands below.
#
# CRITICAL: do NOT use `cargo run` as the start command. `cargo run` recompiles
# on every boot, which on the free tier (512 MB) OOMs or hangs for minutes.
# Build once, run the binary.

services:
  - type: web
    name: rust-nuxt-boilerplate-api
    runtime: rust
    plan: free
    region: oregon
    # Monorepo: backend lives in backend/. Setting rootDir makes Render run
    # commands from there, and avoids redeploying the backend on frontend
    # changes.
    rootDir: backend
    buildCommand: cargo build --release
    startCommand: ./target/release/backend
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: RUST_LOG
        value: info
      # Set the rest (DATABASE_URL, REDIS_URL, JWT_SECRET, ...) in the
      # Render dashboard or via sync: false below. Secrets must never be
      # committed.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MASTER_KEY
        sync: false
      - key: BLIND_INDEX_KEY
        sync: false
      - key: CSRF_SECRET_KEY
        sync: false
      - key: REFRESH_TOKEN_HASH_SALT
        sync: false
      - key: BACKEND_API_KEYS
        sync: false
      - key: FRONTEND_URL
        sync: false