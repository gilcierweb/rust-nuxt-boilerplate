name: CI

# Least privilege: the default token is read/write on contents in a repository
# that never opted into the read-only default, and a pull_request from a public
# fork runs untrusted code. This workflow only ever reads the tree.
permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# runs-on is deliberately `ubuntu-latest` everywhere: the label is moved by
# GitHub to the newest Ubuntu LTS, which is exactly the policy this project
# wants. The "ubuntu-latest will migrate to Ubuntu 26" notice from October
# 2026 is that movement in progress, not a defect, and it asks for no action.
# Pinning a specific release (ubuntu-24.04) would silently freeze the toolchain
# and was rejected on purpose.

jobs:
  # Fast lint job - runs in parallel with build
  backend-lint:
    name: Backend Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Build debug for testing (faster than release)
  backend-build-debug:
    name: Backend Build (debug)
    runs-on: ubuntu-latest
    # Compiles the workspace from a cold cache whenever a dependency or
    # feature changes (which invalidates the Cargo cache), and on the shared
    # 8-minute budget that cancelled this job before. Keep it wide.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./backend
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build backend (debug)
        run: cargo build --bin backend

      - name: Build seed binary (debug)
        run: cargo build --features seed --bin seed

      - name: Upload seed binary (debug)
        uses: actions/upload-artifact@v7
        with:
          name: seed-binary
          path: backend/target/debug/seed
          retention-days: 1

  # Build release binary for E2E in PARALLEL with tests (not after)
  backend-build-release:
    name: Backend Build (release for E2E)
    runs-on: ubuntu-latest
    # Release builds run optimizations over the whole dependency tree, so
    # they are slower than the debug job even when they share its warm cache.
    timeout-minutes: 15
    needs: [backend-build-debug]  # only needs debug build to exist (cache warm)
    defaults:
      run:
        working-directory: ./backend
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build backend (release)
        run: cargo build --bin backend --release

      - name: Upload backend binary
        uses: actions/upload-artifact@v7
        with:
          name: backend-binary
          path: backend/target/release/backend
          retention-days: 1

  # Unit tests (no DB needed) - run in parallel
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    # Compiles the test binaries on top of the debug build's cache; on a
    # cold cache that compile alone has exceeded 8 minutes before.
    timeout-minutes: 15
    needs: [backend-build-debug]
    defaults:
      run:
        working-directory: ./backend
        shell: bash
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Run unit tests (parallel, no DB)
        run: |
          cargo test --lib --bins \
            --test api_version_integration \
            --test cors_integration \
            --test csrf_protection_integration \
            --test health_integration \
            --test migration_rollback \
            --test rate_limit_integration \
            -- --test-threads=4 --skip live_migration_rollback_cycle
        env:
          REDIS_URL: redis://localhost:6379

  # Integration tests (with DB) - run sequentially
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    # Compiles the test binaries, runs a migration rollback cycle, migrates and
    # seeds, then the auth cycle. Every cargo invocation carries --features
    # seed so the whole graph is compiled once: flipping the feature mid-job
    # recompiled the crate from scratch at the seed step (which is what pushed
    # this job past 15 minutes). Only the seed suite reads the feature, so the
    # other suites behave identically. A cold cache still needs headroom.
    timeout-minutes: 20
    needs: [backend-build-debug]
    defaults:
      run:
        working-directory: ./backend
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install diesel_cli (pre-built binary)
        shell: bash
        run: |
          set -euo pipefail
          DIESEL_VERSION="v2.3.11"
          ASSET="diesel_cli-x86_64-unknown-linux-gnu.tar.xz"
          INSTALL_DIR="$HOME/.cargo/bin"
          mkdir -p "$INSTALL_DIR"
          if command -v diesel &> /dev/null && diesel --version | grep -q "$DIESEL_VERSION"; then
            echo "diesel already installed, skipping"
            exit 0
          fi
          echo "Downloading diesel_cli $DIESEL_VERSION (pre-built binary)..."
          TMPDIR="$(mktemp -d)"
          curl -fsSL "https://github.com/diesel-rs/diesel/releases/download/${DIESEL_VERSION}/${ASSET}" \
            -o "$TMPDIR/${ASSET}"
          curl -fsSL "https://github.com/diesel-rs/diesel/releases/download/${DIESEL_VERSION}/${ASSET}.sha256" \
            -o "$TMPDIR/${ASSET}.sha256"
          (cd "$TMPDIR" && sha256sum -c "${ASSET}.sha256")
          tar -xJf "$TMPDIR/${ASSET}" -C "$TMPDIR"
          install -m 0755 "$TMPDIR/diesel_cli-x86_64-unknown-linux-gnu/diesel" "$INSTALL_DIR/diesel"
          rm -rf "$TMPDIR"
          diesel --version

      - name: Compile test binaries once
        # The lib is built in the test profile a single time here, already
        # with the seed feature on. Every suite below then runs with the same
        # flags so the binaries are reused instead of recompiled: cargo keys
        # its cache on the feature set, so a step without the flag would
        # trigger a full rebuild of the crate mid-job.
        run: cargo test --features seed --no-run

      - name: Run migration rollback test (clean DB)
        run: cargo test --features seed --test migration_rollback live_migration_rollback_cycle -- --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Reset database schema after rollback test
        run: psql postgres://postgres:postgres@localhost:5432/test_db -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"

      - name: Run diesel migrations
        run: diesel migration run --database-url postgres://postgres:postgres@localhost:5432/test_db

      - name: Run integration tests (sequential, with DB)
        run: cargo test --features seed --test auth_integration -- --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run handler authorization tests (same database, same keys)
        # Runs after auth_integration on purpose: both suites write subjects to
        # the same database, so this pins the shared encryption keys (a row
        # registered by the first suite has to be readable by the second).
        run: cargo test --features seed --test handler_authorization_integration -- --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run seed convergence tests
        # Runs the seed binary over the migrated database, so every suite after
        # this one reads the demo subjects and the canonical catalog.
        run: cargo test --features seed --test seed_convergence_integration -- --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run rbac grants tests
        run: cargo test --features seed --test rbac_grants_integration -- --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run auth me tests
        run: cargo test --features seed --test auth_me_integration -- --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run profile self service tests
        run: cargo test --features seed --test profile_self_service_integration -- --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run registration tests
        run: cargo test --features seed --test register_role_integration -- --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run registration abuse tests
        run: cargo test --features seed --test register_abuse_integration -- --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run token revocation tests
        run: cargo test --features seed --test token_revocation_integration -- --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run refresh reuse tests
        # Runs after the auth cycle suite on purpose: both suites register
        # subjects in the same database, and the reuse flow asserts on the
        # session family the rotation leaves behind.
        run: cargo test --features seed --test refresh_reuse_integration -- --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run permissions admin tests
        # Runs before the catalog migration suite on purpose: it detaches and
        # deletes a canonical permission row, and the catalog suite re-seeds it
        # and asserts every canonical link of the administrator role.
        run: cargo test --features seed --test permissions_api_integration -- --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run rbac catalog migration tests
        run: cargo test --features seed --test rbac_catalog_migration -- --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run role permissions admin tests
        run: cargo test --features seed --test roles_permissions_api_integration -- --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run user roles assignment tests
        run: cargo test --features seed --test user_roles_api_integration -- --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run admin search and sort tests
        run: cargo test --features seed --test admin_search_sort_integration -- --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
          run_install: false

      - name: Setup Node.js
        # v5 is pinned on purpose: v6+ ("Limit automatic caching to npm")
        # dropped built-in caching for pnpm, which this workflow relies on.
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run lint
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm test -- --run --passWithNoTests

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [frontend-test, backend-build-release]
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download backend binary
        uses: actions/download-artifact@v8
        with:
          name: backend-binary
          path: backend/target/release/

      - name: Download seed binary (debug)
        uses: actions/download-artifact@v8
        with:
          name: seed-binary
          path: backend/target/debug/

      - name: Install diesel_cli (pre-built binary)
        shell: bash
        run: |
          set -euo pipefail
          DIESEL_VERSION="v2.3.11"
          ASSET="diesel_cli-x86_64-unknown-linux-gnu.tar.xz"
          INSTALL_DIR="$HOME/.cargo/bin"
          mkdir -p "$INSTALL_DIR"
          if command -v diesel &> /dev/null && diesel --version | grep -q "$DIESEL_VERSION"; then
            echo "diesel already installed, skipping"
            exit 0
          fi
          echo "Downloading diesel_cli $DIESEL_VERSION (pre-built binary)..."
          TMPDIR="$(mktemp -d)"
          curl -fsSL "https://github.com/diesel-rs/diesel/releases/download/${DIESEL_VERSION}/${ASSET}" \
            -o "$TMPDIR/${ASSET}"
          curl -fsSL "https://github.com/diesel-rs/diesel/releases/download/${DIESEL_VERSION}/${ASSET}.sha256" \
            -o "$TMPDIR/${ASSET}.sha256"
          (cd "$TMPDIR" && sha256sum -c "${ASSET}.sha256")
          tar -xJf "$TMPDIR/${ASSET}" -C "$TMPDIR"
          install -m 0755 "$TMPDIR/diesel_cli-x86_64-unknown-linux-gnu/diesel" "$INSTALL_DIR/diesel"
          rm -rf "$TMPDIR"
          diesel --version

      - name: Make binaries executable
        run: |
          chmod +x backend/target/release/backend
          chmod +x backend/target/debug/seed

      - name: Derive ephemeral test credentials
        # The `|| fallback` pattern used to publish real-shaped secrets in the
        # workflow and gave fork PRs (where secrets are unavailable) a
        # committed, never-rotated key. The values are now generated per run
        # and live only in the job environment.
        run: |
          {
            echo "TEST_JWT_SECRET=$(openssl rand -hex 32)"
            echo "TEST_MASTER_KEY=$(openssl rand -base64 32)"
            echo "TEST_BLIND_INDEX_KEY=$(openssl rand -base64 32)"
            echo "TEST_CSRF_SECRET_KEY=$(openssl rand -hex 32)"
            echo "TEST_REFRESH_TOKEN_HASH_SALT=$(openssl rand -hex 32)"
            echo "BACKEND_API_KEY=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Run diesel migrations (E2E DB)
        run: diesel migration run --database-url postgres://postgres:postgres@localhost:5432/test_db
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db

      - name: Run database seed
        run: |
          backend/target/debug/seed
        working-directory: ${{ github.workspace }}
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ${{ env.TEST_JWT_SECRET }}
          MASTER_KEY: ${{ env.TEST_MASTER_KEY }}
          BLIND_INDEX_KEY: ${{ env.TEST_BLIND_INDEX_KEY }}
          CSRF_SECRET_KEY: ${{ env.TEST_CSRF_SECRET_KEY }}
          REFRESH_TOKEN_HASH_SALT: ${{ env.TEST_REFRESH_TOKEN_HASH_SALT }}
          FRONTEND_URL: "http://localhost:3000"
          ENVIRONMENT: "Test"

      - name: Start backend server
        run: |
          backend/target/release/backend > backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV
        working-directory: ${{ github.workspace }}
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ${{ env.TEST_JWT_SECRET }}
          MASTER_KEY: ${{ env.TEST_MASTER_KEY }}
          BLIND_INDEX_KEY: ${{ env.TEST_BLIND_INDEX_KEY }}
          CSRF_SECRET_KEY: ${{ env.TEST_CSRF_SECRET_KEY }}
          REFRESH_TOKEN_HASH_SALT: ${{ env.TEST_REFRESH_TOKEN_HASH_SALT }}
          FRONTEND_URL: "http://localhost:3000"
          ENVIRONMENT: "Test"
          RUST_LOG: "debug"

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend on port 8080..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              exit 0
            fi
            echo "Attempt $i: Backend not ready yet..."
            sleep 1
          done
          echo "ERROR: Backend failed to start within 60 seconds"
          echo "=== Backend logs ==="
          cat backend.log || true
          echo "===================="
          if [ -n "$BACKEND_PID" ]; then kill $BACKEND_PID || true; fi
          exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
          run_install: false

      - name: Setup Node.js
        # v5 is pinned on purpose: v6+ ("Limit automatic caching to npm")
        # dropped built-in caching for pnpm, which this workflow relies on.
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: ./frontend
        env:
          NITRO_PRESET: node-server

      - name: Start frontend server
        run: |
          HOST=0.0.0.0 PORT=3000 node .output/server/index.mjs &
          echo "FRONTEND_PID=$!" >> $GITHUB_ENV
        working-directory: ./frontend
        env:
          NUXT_BACKEND_API_KEY: ${{ env.BACKEND_API_KEY }}
          NUXT_BACKEND_API_BASE: "http://localhost:8080/api/v1"

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend on port 3000..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is ready!"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Frontend failed to start within 60 seconds"
          exit 1

      - name: Run E2E tests
        run: pnpm run test:e2e
        working-directory: ./frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop servers
        if: always()
        run: |
          if [ -n "$BACKEND_PID" ]; then kill $BACKEND_PID || true; fi
          if [ -n "$FRONTEND_PID" ]; then kill $FRONTEND_PID || true; fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend-lint, backend-unit-tests, backend-integration-tests, backend-build-release, frontend-test, frontend-e2e]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks (push gate)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}