name: Dependency Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  cargo-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

  pnpm-audit:
    name: Node.js Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        # Two advisories are accepted in frontend/pnpm-workspace.yaml (auditConfig.ignoreGhsas):
        # no patched version exists and both are dev/build-time toolchain only,
        # not shipped in the Nuxt build output:
        # - GHSA-86w9-cpqp-85rv (node-forge <=1.4.0): listhen self-signed certs
        #   for the dev server, via nuxt -> @nuxt/cli / nitropack.
        # - GHSA-vfj7-8cjw-p6xm (braces <=3.0.3): build-time glob matching,
        #   via nitropack/globby and @nuxtjs/i18n unplugin.
        # When patched versions are released upstream (node-forge >=1.4.1,
        # braces >=3.0.4), run `pnpm update` and remove the ignores.
        run: pnpm audit --prod --audit-level=moderate
