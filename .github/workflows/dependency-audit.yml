name: Dependency Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  cargo-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

  pnpm-audit:
    name: Node.js Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - name: Setup Node.js
        # v5 is pinned on purpose: v6+ ("Limit automatic caching to npm")
        # dropped built-in caching for pnpm, which this workflow relies on.
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        # One advisory is accepted in frontend/pnpm-workspace.yaml (auditConfig.ignoreGhsas):
        # picomatch has no patched release (latest 4.0.7 still flagged,
        # GHSA-fc5q-39xc-vjpf) and it is only used for build-time glob matching
        # (nitropack/globby/micromatch/anymatch, @nuxtjs/i18n unplugin), never
        # shipped in the Nuxt build output. Re-run `pnpm audit` after a patched
        # picomatch is released upstream and remove the ignore.
        run: pnpm audit --prod --audit-level=moderate
