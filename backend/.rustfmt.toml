# Rustfmt Configuration
# This file ensures consistent code formatting across all contributors.
#
# STABLE OPTIONS ONLY. Every key below is understood by the stable toolchain
# and behaves identically on nightly. Keys that only nightly applies are
# excluded deliberately: stable ignores them silently, so a config that sets
# them lets the two toolchains disagree (before, `cargo +nightly fmt --check`
# reported 23 violations that stable never saw). If a nightly-only style is
# ever wanted, move the whole check to nightly instead of mixing both.

edition = "2024"
max_width = 100

# Indentation: 4 spaces, no tabs
tab_spaces = 4
hard_tabs = false

newline_style = "Unix"

# Match arms
match_arm_leading_pipes = "Never"
match_block_trailing_comma = true

# Reorder imports
reorder_imports = true

# Use field init shorthand
use_field_init_shorthand = true

# Use try shorthand
use_try_shorthand = true
